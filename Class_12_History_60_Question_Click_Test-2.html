<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>कक्षा 12 इतिहास — 60 प्रश्न टेस्ट</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}
.card{max-width:650px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 3px 14px #0002}
h1{font-size:22px;margin-top:0}
.progress{color:#666;margin-bottom:15px}
.option{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:12px;background:#fff;font-size:16px}
.option:active{background:#eee}
button.next{width:100%;padding:14px;border:0;border-radius:12px;background:#1769aa;color:white;font-size:17px;margin-top:10px}
#result{display:none;text-align:center}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<div class="card" id="quiz">
<h1>कक्षा 12 इतिहास — ऑनलाइन MCQ टेस्ट</h1>
<div class="progress" id="progress"></div>
<div id="question"></div>
<div id="options"></div>
<button class="next" id="next" style="display:none">अगला प्रश्न</button>
<p class="small">हर प्रश्न 1 अंक का है। उत्तर चुनकर “अगला प्रश्न” दबाएँ।</p>
</div>
<div class="card" id="result">
<h1>टेस्ट पूरा हुआ 🎉</h1>
<p id="score"></p>
<button class="next" onclick="location.reload()">फिर से टेस्ट दें</button>
</div>
<script>
const questions = [{"q": "अल-बिरूनी किस देश का निवासी था?", "options": ["भारत", "फारस", "चीन", "अरब"], "answer": 1}, {"q": "अल-बिरूनी भारत किस शताब्दी में आया था?", "options": ["9वीं", "10वीं", "11वीं", "12वीं"], "answer": 2}, {"q": "अल-बिरूनी की प्रसिद्ध पुस्तक का नाम क्या है?", "options": ["रिहला", "किताब-उल-हिंद", "अकबरनामा", "बाबरनामा"], "answer": 1}, {"q": "अल-बिरूनी ने भारतीय समाज को समझने के लिए किस भाषा का अध्ययन किया?", "options": ["अरबी", "फारसी", "संस्कृत", "तुर्की"], "answer": 2}, {"q": "इब्न बतूता किस देश का यात्री था?", "options": ["मोरक्को", "चीन", "ईरान", "अफगानिस्तान"], "answer": 0}, {"q": "इब्न बतूता भारत किस शासक के समय आया था?", "options": ["अलाउद्दीन खिलजी", "मुहम्मद बिन तुगलक", "फिरोज तुगलक", "अकबर"], "answer": 1}, {"q": "इब्न बतूता के यात्रा-वृत्तांत का नाम क्या है?", "options": ["किताब-उल-हिंद", "रिहला", "पृथ्वीराज रासो", "राजतरंगिणी"], "answer": 1}, {"q": "इब्न बतूता को दिल्ली में कौन-सा पद दिया गया था?", "options": ["सेनापति", "काजी", "मंत्री", "व्यापारी"], "answer": 1}, {"q": "इब्न बतूता ने भारत की किस व्यवस्था की प्रशंसा की?", "options": ["डाक व्यवस्था", "कृषि व्यवस्था", "शिक्षा व्यवस्था", "न्याय व्यवस्था"], "answer": 0}, {"q": "इब्न बतूता चीन किस रूप में गया था?", "options": ["व्यापारी", "राजदूत", "सैनिक", "शिक्षक"], "answer": 1}, {"q": "फ्रांस्वा बर्नियर किस देश का यात्री था?", "options": ["फ्रांस", "पुर्तगाल", "इटली", "इंग्लैंड"], "answer": 0}, {"q": "बर्नियर भारत में किस मुगल शासक के समय आया था?", "options": ["बाबर", "अकबर", "शाहजहाँ", "औरंगजेब"], "answer": 3}, {"q": "बर्नियर ने भारत की तुलना मुख्य रूप से किस देश से की?", "options": ["चीन", "फ्रांस", "रूस", "जापान"], "answer": 1}, {"q": "बर्नियर के अनुसार मुगल साम्राज्य में भूमि का स्वामी कौन था?", "options": ["किसान", "जमींदार", "राजा", "व्यापारी"], "answer": 2}, {"q": "यात्रियों के विवरण इतिहासकारों के लिए क्यों महत्वपूर्ण हैं?", "options": ["वे केवल युद्ध बताते हैं", "वे समाज और संस्कृति की जानकारी देते हैं", "वे केवल धर्म बताते हैं", "वे केवल राजाओं की सूची देते हैं"], "answer": 1}, {"q": "अल-बिरूनी ने भारतीय समाज में किस व्यवस्था का वर्णन किया?", "options": ["वर्ण व्यवस्था", "लोकतंत्र", "साम्यवाद", "सामंतवाद"], "answer": 0}, {"q": "अल-बिरूनी ने भारतीयों की किस विशेषता की आलोचना की?", "options": ["भाषाई ज्ञान", "सामाजिक अलगाव", "व्यापार", "कृषि"], "answer": 1}, {"q": "इब्न बतूता ने भारत की किस चीज को देखकर आश्चर्य व्यक्त किया?", "options": ["डाक व्यवस्था", "पहाड़", "समुद्र", "जंगल"], "answer": 0}, {"q": "इब्न बतूता के अनुसार डाक व्यवस्था किस कारण महत्वपूर्ण थी?", "options": ["संदेश तेजी से पहुँचते थे", "कर कम लगता था", "व्यापार बंद था", "सेना नहीं थी"], "answer": 0}, {"q": "यात्रियों के विवरण में अक्सर किसका वर्णन मिलता है?", "options": ["सामाजिक जीवन", "केवल युद्ध", "केवल मौसम", "केवल कृषि"], "answer": 0}, {"q": "अल-बिरूनी का जन्म कहाँ हुआ था?", "options": ["ख्वारिज्म", "दिल्ली", "काबुल", "लाहौर"], "answer": 0}, {"q": "इब्न बतूता ने भारत के अलावा किस क्षेत्र की यात्रा की?", "options": ["चीन", "अमेरिका", "ऑस्ट्रेलिया", "दक्षिण अफ्रीका"], "answer": 0}, {"q": "बर्नियर का पेशा क्या था?", "options": ["चिकित्सक", "सैनिक", "किसान", "नाविक"], "answer": 0}, {"q": "यात्रियों के विवरण को पढ़ते समय इतिहासकारों को क्या ध्यान रखना चाहिए?", "options": ["यात्री की दृष्टि और पूर्वाग्रह", "केवल तारीख", "केवल नाम", "केवल स्थान"], "answer": 0}, {"q": "“किताब-उल-हिंद” मुख्यतः किस विषय से संबंधित है?", "options": ["भारत का समाज और संस्कृति", "यूरोप का इतिहास", "चीन का इतिहास", "युद्धों का इतिहास"], "answer": 0}, {"q": "इब्न बतूता के वृत्तांत को किस नाम से जाना जाता है?", "options": ["रिहला", "किताब-उल-हिंद", "आईन-ए-अकबरी", "तुजुक-ए-बाबरी"], "answer": 0}, {"q": "बर्नियर ने भारतीय किसानों की स्थिति के बारे में क्या लिखा?", "options": ["वे अत्यंत समृद्ध थे", "उनकी स्थिति कठिन थी", "वे व्यापारी थे", "वे शासक थे"], "answer": 1}, {"q": "यात्रियों ने भारतीय शहरों के बारे में किस बात का उल्लेख किया?", "options": ["बाजार और व्यापार", "केवल मंदिर", "केवल किले", "केवल खेत"], "answer": 0}, {"q": "अल-बिरूनी ने भारतीय ज्ञान को समझने के लिए किस ग्रंथ परंपरा का अध्ययन किया?", "options": ["संस्कृत ग्रंथ", "यूनानी ग्रंथ", "लैटिन ग्रंथ", "चीनी ग्रंथ"], "answer": 0}, {"q": "यात्रियों के वृत्तांत इतिहास के किस स्रोत के उदाहरण हैं?", "options": ["विदेशी यात्रियों के विवरण", "अभिलेख", "सिक्के", "पुरातात्विक अवशेष"], "answer": 0}, {"q": "भक्ति आंदोलन का मुख्य आधार क्या था?", "options": ["ईश्वर के प्रति व्यक्तिगत भक्ति", "युद्ध", "व्यापार", "राजनीति"], "answer": 0}, {"q": "दक्षिण भारत में भक्ति आंदोलन के प्रमुख संत कौन थे?", "options": ["आलवार और नयनार", "कबीर और नानक", "चिश्ती और सुहरावर्दी", "तुलसी और सूर"], "answer": 0}, {"q": "आलवार किस देवता के भक्त थे?", "options": ["विष्णु", "शिव", "ब्रह्मा", "सूर्य"], "answer": 0}, {"q": "नयनार किस देवता के भक्त थे?", "options": ["विष्णु", "शिव", "कृष्ण", "गणेश"], "answer": 1}, {"q": "आलवार और नयनार किस क्षेत्र से जुड़े थे?", "options": ["तमिलनाडु", "पंजाब", "बंगाल", "गुजरात"], "answer": 0}, {"q": "कबीर किस प्रकार की भक्ति के लिए प्रसिद्ध हैं?", "options": ["निर्गुण भक्ति", "सगुण भक्ति", "राजभक्ति", "वीर भक्ति"], "answer": 0}, {"q": "कबीर ने किसका विरोध किया?", "options": ["बाहरी आडंबर और जातिगत भेदभाव", "शिक्षा", "व्यापार", "कृषि"], "answer": 0}, {"q": "गुरु नानक किस धर्म के संस्थापक माने जाते हैं?", "options": ["सिख धर्म", "जैन धर्म", "बौद्ध धर्म", "पारसी धर्म"], "answer": 0}, {"q": "गुरु नानक की शिक्षाओं में किस पर विशेष जोर था?", "options": ["एक ईश्वर और समानता", "जाति व्यवस्था", "युद्ध", "धन-संचय"], "answer": 0}, {"q": "मीराबाई किसकी भक्त थीं?", "options": ["कृष्ण", "शिव", "राम", "बुद्ध"], "answer": 0}, {"q": "मीराबाई किस क्षेत्र से संबंधित थीं?", "options": ["राजस्थान", "पंजाब", "बंगाल", "महाराष्ट्र"], "answer": 0}, {"q": "चैतन्य महाप्रभु किसकी भक्ति से जुड़े थे?", "options": ["कृष्ण", "शिव", "सूर्य", "गणेश"], "answer": 0}, {"q": "सूफी परंपरा किस धर्म से संबंधित है?", "options": ["इस्लाम", "हिंदू धर्म", "बौद्ध धर्म", "जैन धर्म"], "answer": 0}, {"q": "सूफी संतों के निवास और केंद्र को क्या कहा जाता था?", "options": ["खानकाह", "विहार", "मठ", "सभा"], "answer": 0}, {"q": "सूफी संतों की परंपरा में गुरु को क्या कहा जाता था?", "options": ["पीर", "राजा", "पंडित", "भिक्षु"], "answer": 0}, {"q": "सूफी शिष्य को क्या कहा जाता था?", "options": ["मुरीद", "नायक", "शिष्यराज", "साधु"], "answer": 0}, {"q": "चिश्ती सिलसिला भारत में किस कारण प्रसिद्ध हुआ?", "options": ["प्रेम, सेवा और आध्यात्मिकता", "सैन्य शक्ति", "व्यापार", "कर व्यवस्था"], "answer": 0}, {"q": "ख्वाजा मुईनुद्दीन चिश्ती की दरगाह कहाँ है?", "options": ["अजमेर", "दिल्ली", "आगरा", "लखनऊ"], "answer": 0}, {"q": "निजामुद्दीन औलिया किस सूफी सिलसिले से संबंधित थे?", "options": ["चिश्ती", "सुहरावर्दी", "नक्शबंदी", "कादिरी"], "answer": 0}, {"q": "सूफी संतों की समाधि को क्या कहा जाता है?", "options": ["दरगाह", "खानकाह", "विहार", "मठ"], "answer": 0}, {"q": "भक्ति संतों ने किस बात पर जोर दिया?", "options": ["व्यक्तिगत ईश्वर-भक्ति", "जाति भेद", "राजसत्ता", "धन-संपत्ति"], "answer": 0}, {"q": "कबीर की रचनाओं का संग्रह किस ग्रंथ में मिलता है?", "options": ["बीजक", "रिहला", "अकबरनामा", "किताब-उल-हिंद"], "answer": 0}, {"q": "गुरु नानक की वाणी किस ग्रंथ में संकलित है?", "options": ["गुरु ग्रंथ साहिब", "रामचरितमानस", "बीजक", "वेद"], "answer": 0}, {"q": "भक्ति आंदोलन ने किस सामाजिक विचार को बढ़ावा दिया?", "options": ["समानता", "जातिगत भेदभाव", "राजशाही", "साम्राज्यवाद"], "answer": 0}, {"q": "सूफी परंपरा में ‘समाअ’ का संबंध किससे है?", "options": ["संगीत और आध्यात्मिक साधना", "युद्ध", "कृषि", "व्यापार"], "answer": 0}, {"q": "खानकाहों में किस प्रकार की गतिविधियाँ होती थीं?", "options": ["आध्यात्मिक और सामाजिक गतिविधियाँ", "केवल सैनिक प्रशिक्षण", "केवल व्यापार", "केवल कर संग्रह"], "answer": 0}, {"q": "बसवन्ना किस आंदोलन से जुड़े थे?", "options": ["वीरशैव/लिंगायत", "सूफी", "जैन", "बौद्ध"], "answer": 0}, {"q": "लिंगायत परंपरा में किस देवता की उपासना प्रमुख थी?", "options": ["शिव", "विष्णु", "कृष्ण", "सूर्य"], "answer": 0}, {"q": "भक्ति और सूफी परंपराओं की एक प्रमुख समानता क्या थी?", "options": ["ईश्वर से व्यक्तिगत संबंध पर जोर", "जाति व्यवस्था को बढ़ावा", "केवल राजाओं की सेवा", "केवल व्यापार पर जोर"], "answer": 0}, {"q": "भक्ति-सूफी परंपराओं का भारतीय समाज पर क्या प्रभाव पड़ा?", "options": ["धार्मिक और सामाजिक विचारों में बदलाव आया", "व्यापार समाप्त हो गया", "कृषि समाप्त हो गई", "नगर समाप्त हो गए"], "answer": 0}];
let i=0, score=0, answered=false;
const qEl=document.getElementById('question'), oEl=document.getElementById('options');
const next=document.getElementById('next'), prog=document.getElementById('progress');
function render(){
  answered=false; next.style.display='none';
  prog.textContent=`प्रश्न ${i+1} / ${questions.length}`;
  qEl.innerHTML='<h2>'+questions[i].q+'</h2>';
  oEl.innerHTML='';
  questions[i].options.forEach((op,idx)=>{
    const b=document.createElement('button'); b.className='option';
    b.textContent=String.fromCharCode(65+idx)+'. '+op;
    b.onclick=()=>choose(idx,b);
    oEl.appendChild(b);
  });
}
function choose(idx,b){
  if(answered)return; answered=true;
  const buttons=oEl.querySelectorAll('button');
  buttons.forEach(x=>x.disabled=true);
  if(idx===questions[i].answer){score++;b.style.border='2px solid green';}
  else{b.style.border='2px solid red'; buttons[questions[i].answer].style.border='2px solid green';}
  next.style.display='block';
}
next.onclick=()=>{
  i++;
  if(i<questions.length) render();
  else {
    document.getElementById('quiz').style.display='none';
    document.getElementById('result').style.display='block';
    document.getElementById('score').textContent=`आपके अंक: ${score} / ${questions.length}`;
  }
};
render();
</script>
</body>
</html>
